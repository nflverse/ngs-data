on:
  schedule:
    # runs every day at 7:07 AM UTC = 3AM ET in jan, feb, sep-dec
    - cron:  '7 7 * 1,2,9-12 *'
  workflow_dispatch:
    inputs:
      season_rebuild:
        description: 'Rebuild Season (9999 defaults to latest season). Do multiple seasons comma separated, e.g. 2017,2019,2021'
        required: false
        default: 9999
        type: number
      full_rebuild:
        description: 'Full Rebuild (overwrites above season)'
        required: true
        default: false
        type: boolean

name: Update NGS Data

jobs:
  ngs_setup:
    runs-on: ubuntu-latest
    name: ngs_setup
    outputs:
      seasons: ${{ steps.seasons.outputs.seasons }}
    steps:
      - id: seasons
        uses: nflverse/actions/season-matrix@v1
        with:
          first-season: 2016
          season-rebuild: ${{ inputs.season_rebuild }}
          full-rebuild: ${{ inputs.full_rebuild }}

  update_ngs_seasons:
    needs: ngs_setup
    name: Update ${{ matrix.season }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJson(needs.ngs_setup.outputs.seasons) }}
        type: ["passing", "rushing", "receiving"]
    env:
      NFLVERSE_UPDATE_SEASON: ${{ matrix.season }}
      NFLVERSE_UPDATE_TYPE: ${{ matrix.type }}
    steps:
      # Checkout + nflverse packages at their latest commit + DESCRIPTION deps
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflverse-data nflverse/nflreadr

      # write access to this repo's ngs-season release only. Minted after
      # setup, which installs unpinned GitHub code.
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          contents: write

      - name: Release ${{ matrix.type }}
        run: Rscript -e 'source("exec/update_ngs.R")'
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}

  combine_stats:
    needs: [ngs_setup, update_ngs_seasons]
    name: Combine NGS Season Data
    runs-on: ubuntu-latest
    # R + all dependencies preinstalled, see https://github.com/nflverse/actions
    container: ghcr.io/nflverse/r-runner:latest
    steps:
      # Checkout + nflverse packages at their latest commit + DESCRIPTION deps
      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflverse-data nflverse/nflreadr

      # write access to the nextgen_stats release of nflverse-data only
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-data
          contents: write

      - name: Release Combined NGS Data
        run: Rscript -e 'source("exec/combine_ngs.R")'
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
